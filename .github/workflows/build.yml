name: Build sid1~

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Engine render test
        run: |
          cc -O2 -Wall -std=c99 tests/render_test.c engine/sid1_engine.c core/sid.c -lm -o render_test
          ./render_test && ./render_test 2x
          cc -O2 -Wall -std=c99 tests/random_test.c engine/sid1_random.c engine/sid1_engine.c core/sid.c -lm -o random_test
          ./random_test

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S max -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
      - name: Build
        run: cmake --build build --config Release
      - name: Check architectures and minimum macOS (must run on Monterey)
        run: |
          set -e
          BIN=$(find build/externals -path '*sid1~.mxo/Contents/MacOS/*' -type f | head -1)
          echo "binary: $BIN"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64
          for a in x86_64 arm64; do
            MINOS=$(otool -arch $a -l "$BIN" | awk '/LC_BUILD_VERSION/{b=1} /LC_VERSION_MIN_MACOSX/{m=1} b&&/minos/{print $2;exit} m&&/version/{print $2;exit}')
            [ -n "$MINOS" ] || { echo "$a: no minimum macOS found"; exit 1; }
            echo "$a minos $MINOS"
            [ "$(printf '%s\n11.0\n' "$MINOS" | sort -V | tail -1)" = "11.0" ] || { echo "minos $MINOS is newer than 11.0"; exit 1; }
          done
      - name: Package
        run: |
          cd build/externals && ditto -c -k --keepParent "sid1~.mxo" ../../sid1-mac.zip
      - uses: actions/upload-artifact@v5
        with:
          name: sid1-mac
          path: sid1-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S max -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse build -Filter "sid1~.mxe64" | Select-Object -First 1
          Write-Host $f.FullName
          Compress-Archive -Path $f.FullName -DestinationPath sid1-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: sid1-windows
          path: sid1-windows.zip

  device:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Build the device and the PDFs
        run: |
          pip install reportlab pillow
          python3 device/build_device.py SID1.amxd
          python3 docs/build_docs.py SID1.amxd docs-out
      - name: Device kit (unfrozen device + scripts + both externals + docs)
        run: |
          V=$(grep -m1 '^VERSION' device/build_device.py | cut -d'"' -f2)
          K="SID1-$V-device-kit"
          mkdir -p "$K"
          cp SID1.amxd device/*.js "$K"/
          unzip -q sid1-mac.zip -d "$K"
          unzip -q sid1-windows.zip -d "$K"
          cp "docs-out/SID1 User Manual.pdf" "docs-out/SID1 Update History.pdf" "$K"/
          zip -qr "$K.zip" "$K"
          cp "docs-out/SID1 User Manual.pdf" SID1-User-Manual.pdf
          cp "docs-out/SID1 Update History.pdf" SID1-Update-History.pdf
          ls -la "$K"
      - uses: actions/upload-artifact@v5
        with:
          name: sid1-device
          path: |
            SID1-*-device-kit.zip
            SID1-User-Manual.pdf
            SID1-Update-History.pdf

  release:
    # a new VERSION in device/build_device.py on main publishes release v<VERSION> (once)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, mac, windows, device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^VERSION' device/build_device.py | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.v.outputs.exists == '0'
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == '0'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SID1 ${{ steps.v.outputs.version }}
          body: |
            SID1 ${{ steps.v.outputs.version }}: dual MOS SID synth for Max for Live (Mac and Windows).
            The device kit holds the unfrozen device, its scripts, both sid1~ externals, the user manual and the update history.
          files: |
            SID1-*-device-kit.zip
            SID1-User-Manual.pdf
            SID1-Update-History.pdf
            sid1-mac.zip
            sid1-windows.zip
